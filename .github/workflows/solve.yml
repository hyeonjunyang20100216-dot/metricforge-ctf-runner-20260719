          selected = names[start:start + batch_size]
          if not selected:
              raise SystemExit(f"empty batch {batch}; total candidates={len(names)}")
          matrix = {"include": [
              {"id": f"b{batch:02d}_{i:03d}", "role": f"arn:aws:iam::{account}:role/{name}"}
              for i, name in enumerate(selected)
          ]}
          print(f"batch={batch} start={start} count={len(selected)} total={len(names)}")
          for item in matrix["include"]:
              print(item["id"], item["role"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
