name: metricforge probe

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Candidate batch index
        required: false
        default: "0"

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  configure-oidc-subject:
    runs-on: ubuntu-latest
    steps:
      - name: Configure repository OIDC subject for reusable workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${OWNER_REPO}/actions/oidc/customization/sub"
          body='{"use_default":false,"include_claim_keys":["job_workflow_ref"]}'
          code=$(curl -sS -L -o /tmp/oidc-put.out -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$api" \
            -d "$body")
          cat /tmp/oidc-put.out || true
          echo "PUT_HTTP=${code}"
          test "$code" = "201"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$api"

  plan-candidates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        env:
          BATCH: ${{ github.event.inputs.batch || '0' }}
        run: |
          python3 - <<'PY'
          import json, os
          account = "125746528491"
          batch = int(os.environ.get("BATCH") or "0")
